services:
  workledger-backend:
    build:
      context: ../../../../apps/backend
      dockerfile: Dockerfile
    container_name: workledger-backend
    restart: unless-stopped
    env_file:
      - ../../../../apps/backend/.env
    environment:
      PORT: 5000
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
